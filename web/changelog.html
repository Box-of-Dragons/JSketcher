<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Changelog - JSketcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      var host = location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.ddev.site') !== -1;
      var version = 'jsketcher-header-20260731c';
      var liveHref = 'https://structuredchaos.dev/css/shared.css?v=' + version;
      var localHref = 'http://localhost:4000/css/shared.css?v=' + version;
      var link = document.createElement('link');
      var loaded = false;

      function useLiveFallback() {
        if (loaded || !isLocal || link.href === liveHref) return;
        link.href = liveHref;
      }

      link.rel = 'stylesheet';
      link.href = isLocal ? localHref : liveHref;
      link.onload = function () { loaded = true; };
      link.onerror = useLiveFallback;
      document.head.appendChild(link);

      if (isLocal) window.setTimeout(useLiveFallback, 1200);
    })();
  </script>
  <link rel="stylesheet" href="./css/site-shell.css">
  <link rel="shortcut icon" href="./img/cad/cube96.png">
</head>
<body class="page-jsketcher page-jsketcher-doc page-document page-changelog" data-md-src="https://raw.githubusercontent.com/Box-of-Dragons/JSketcher/main/docs/changelog.md">
  <script>window.SITE_HEADER = {
    brand: 'JSketcher',
    nav: [
      {
        label: 'CAD',
        localHref: '/',
        liveHref: 'https://jsketcher.structuredchaos.dev/'
      },
      {
        label: 'Roadmap',
        localHref: '/roadmap.html',
        liveHref: 'https://jsketcher.structuredchaos.dev/roadmap.html'
      },
      {
        label: 'Changelog',
        localHref: '/changelog.html',
        liveHref: 'https://jsketcher.structuredchaos.dev/changelog.html'
      }
    ],
    github: 'https://github.com/Box-of-Dragons/JSketcher',
    gitlab: 'https://gitlab.com/structured-chaos/JSketcher'
  };</script>
  <div id="global-bar" data-active="jsketcher"></div>
  <script>
    (function () {
      var host = location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.ddev.site') !== -1;
      var version = 'jsketcher-header-20260731c';

      function loadSharedScript(file) {
        var loaded = false;
        var primary = (isLocal ? 'http://localhost:4000' : 'https://structuredchaos.dev') + '/js/' + file + '?v=' + version;
        var fallback = 'https://structuredchaos.dev/js/' + file + '?v=' + version;
        var script = document.createElement('script');

        function useLiveFallback() {
          if (loaded || !isLocal || script.src === fallback) return;
          var fallbackScript = document.createElement('script');
          fallbackScript.src = fallback;
          fallbackScript.defer = true;
          fallbackScript.async = false;
          document.head.appendChild(fallbackScript);
        }

        script.src = primary;
        script.defer = true;
        script.async = false;
        script.onload = function () { loaded = true; };
        script.onerror = useLiveFallback;
        document.head.appendChild(script);

        if (isLocal) window.setTimeout(useLiveFallback, 1200);
      }

      loadSharedScript('global-bar.js');
      loadSharedScript('site-header.js');
      loadSharedScript('site-footer.js');
    })();
  </script>
  <script src="./js/shared-shell-fallback.js" defer></script>
  <div id="site-header"></div>

  <section class="page-subheader">
    <div class="shell">
      <div class="page-subheader-inner">
        <h1>Changelog</h1>
      </div>
    </div>
  </section>

  <main class="shell page-layout page-main">
    <div class="content-main">
      <div class="container">
        <div class="changelog-loading" id="changelog-loading">Loading changelog…</div>
        <div id="changelog-content"></div>
      </div>
    </div>

    <aside class="sidebar sidebar--sticky">
      <div class="container-sections">
        <section class="container-section--headed">
          <div class="container-section-header">About this log</div>
          <div class="container-section-body">
            <div class="body">Only commits unique to this fork are listed. Upstream history is excluded. The changelog is generated from conventional commits using <code>git cherry upstream/main main</code> during the build step.</div>
          </div>
        </section>
        <div class="changelog-types-sidebar" id="changelog-types-sidebar"></div>
      </div>
    </aside>
  </main>

  <script>window.SITE_FOOTER = { label: 'JSketcher', buildInfoSrc: '/js/buildInfo.js' };</script>
  <div id="site-footer"></div>

  <script>
    (function () {
      var loadingEl = document.getElementById('changelog-loading');
      var contentEl = document.getElementById('changelog-content');
      var typesSidebar = document.getElementById('changelog-types-sidebar');

      function relocateSidebarBlocks(contentEl) {
        if (!typesSidebar || !contentEl) return;
        var blocks = contentEl.querySelectorAll('.changelog-types, .changelog-versions');
        blocks.forEach(function (block) {
          typesSidebar.appendChild(block);
        });
      }

      fetch('/changelog-fragment.html?v=' + encodeURIComponent(Date.now()), { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (html) {
          contentEl.innerHTML = html;
          loadingEl.style.display = 'none';
          relocateSidebarBlocks(contentEl);
        })
        .catch(function (err) {
          loadingEl.className = 'changelog-error';
          loadingEl.textContent = 'Failed to load changelog: ' + err.message;
        });
    })();
  </script>
</body>
</html>
